<div class="app-shell">

  <app-header />

  <main>
    <router-outlet />
  </main>

  <app-footer />

</div>
@if (notificationService.visible()) {

  <app-error-state
    [message]="notificationService.message()"
    [type]="notificationService.type()"
    [duration]="5000"
    (closed)="notificationService.hide()"
  />

}
